<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="description" content="Submit a product review including rating, features, and feedback. Quick and easy review form.">
    <meta name="author" content="Wilson Cardichon">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review Form</h1>
    </header>

    <main>
        <form id="reviewForm" method="get" action="review.html">
            <label for="product">Product Name *</label>
            <select id="product" name="product" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <fieldset>
                <legend>Overall Rating *</legend>

                <input type="radio" id="star1" name="rating" value="1" required>
                <label for="star1">☆</label>

                <input type="radio" id="star2" name="rating" value="2" required>
                <label for="star2">☆☆</label>

                <input type="radio" id="star3" name="rating" value="3" required>
                <label for="star3">☆☆☆</label>

                <input type="radio" id="star4" name="rating" value="4" required>
                <label for="star4">☆☆☆☆</label>

                <input type="radio" id="star5" name="rating" value="5" required>
                <label for="star5">☆☆☆☆☆</label>
            </fieldset>

            <label for="installDate">Date of Installation *</label>
            <input type="date" id="installDate" name="installDate" required>

            <fieldset>
                <legend>Useful Features</legend>

                <input type="checkbox" id="durable" name="features" value="durable">
                <label for="durable">Durable</label>

                <input type="checkbox" id="easy" name="features" value="easy-to-use">
                <label for="easy">Easy to Use</label>

                <input type="checkbox" id="energy" name="features" value="energy-efficient">
                <label for="energy">Energy Efficient</label>

                <input type="checkbox" id="compact" name="features" value="compact">
                <label for="compact">Compact</label>
            </fieldset>

            <label for="review">Written Review</label>
            <textarea id="review" name="review" rows="5" placeholder="Write your review here..."></textarea>

            <label for="username">Your Name</label>
            <input type="text" id="username" name="username" placeholder="Optional">

            <input type="submit" value="Submit Review">
        </form>
    </main>

     <footer>
         <p> 
          © <span id="currentyear"></span>👍 Wilson Cardichon 👍 Port-au-Prince </p>
          <p id="lastModified"></p>
     </footer>

</body>
</html>
