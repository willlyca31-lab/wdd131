<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-large.css" media="screen and (max-width: 600px)">
    <script src="scripts/form.js"></script>
</head>
<body>
    <header>
        <h1>Product Review Form</h1>
    </header>

    <main>
        <form id="reviewForm" method="get" action="review.html">
            <label for="product">Product Name *</label>
            <select id="product" name="product" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <fieldset>
                <legend>Overall Rating *</legend>
                <label><input type="radio" name="rating" value="1" required> ☆</label>
                <label><input type="radio" name="rating" value="2"> ☆☆</label>
                <label><input type="radio" name="rating" value="3"> ☆☆☆</label>
                <label><input type="radio" name="rating" value="4"> ☆☆☆☆</label>
                <label><input type="radio" name="rating" value="5"> ☆☆☆☆☆</label>
            </fieldset>

            <label for="installDate">Date of Installation *</label>
            <input type="date" id="installDate" name="installDate" required>

            <fieldset>
                <legend>Useful Features</legend>
                <label><input type="checkbox" name="features" value="durable"> Durable</label>
                <label><input type="checkbox" name="features" value="easy-to-use"> Easy to Use</label>
                <label><input type="checkbox" name="features" value="energy-efficient"> Energy Efficient</label>
                <label><input type="checkbox" name="features" value="compact"> Compact</label>
            </fieldset>

            <label for="review">Written Review</label>
            <textarea id="review" name="review" rows="5" placeholder="Write your review here..."></textarea>

            <label for="username">Your Name</label>
            <input type="text" id="username" name="username" placeholder="Optional">

            <input type="submit" value="Submit Review">
        </form>
    </main>

     <footer>
         <p> 
          © <span id="currentyear"></span>👍 Wilson Cardichon 👍 Port-au-Prince </p>
          <p id="lastModified"></p>
     </footer>

</body>
</html>
